<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — MusicLib</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <h1>MusicLib</h1>
      <p>Create your account</p>
    </div>

    <div class="auth-card">
      <h2>Join MusicLib 🎵</h2>
      <div id="alert" class="alert"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
          Create Account
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Already have an account? <a href="/user-login.html">Sign in</a>
    </p>
    <p class="auth-footer" style="margin-top:8px;">
      <a href="/index.html">← Back to Home</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (isLoggedIn() && isUser()) window.location.href = '/user-dashboard.html';

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Creating account...';

    const res = await apiPost('/api/users/register', {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phoneNumber: document.getElementById('phone').value,
      password: document.getElementById('password').value
    });

    btn.disabled = false; btn.textContent = 'Create Account';

    if (res && res.ok) {
      showAlert('alert', 'Account created! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/user-login.html', 1500);
    } else {
      const errData = res?.data;
      if (typeof errData === 'object' && !errData.message) {
        showAlert('alert', Object.values(errData).join(' | '));
      } else {
        showAlert('alert', errData?.message || 'Registration failed');
      }
    }
  });
</script>
</body>
</html>
