<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — MusicLib</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon" style="background: var(--info);">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4a3 3 0 110 6 3 3 0 010-6zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
      <h1>MusicLib Admin</h1>
      <p>Administrative Portal</p>
    </div>

    <div class="auth-card">
      <h2>Admin Sign In 🛡️</h2>
      <div id="alert" class="alert"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@musiclibrary.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-full btn-lg" style="background: var(--info); color: white;" id="submitBtn">
          Admin Sign In
        </button>
      </form>
    </div>

    <p class="auth-footer">
      <a href="/user-login.html">User login</a> · <a href="/index.html" onclick="sessionStorage.clear()">Home</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (isLoggedIn() && isAdmin()) window.location.href = '/admin-dashboard.html';

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';

    try {
      const res = await apiPost('/api/admin/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (res && res.ok) {
        sessionStorage.setItem('token', res.data.token);
        sessionStorage.setItem('user', JSON.stringify({ ...res.data, role: 'ROLE_ADMIN' }));
        window.location.href = '/admin-dashboard.html';
      } else {
        showAlert('alert', res?.data?.message || 'Invalid admin credentials');
      }
    } catch (err) {
      showAlert('alert', 'Connection error. Please check services are running.');
    } finally {
      btn.disabled = false; btn.textContent = 'Admin Sign In';
    }
  });
</script>
</body>
</html>
