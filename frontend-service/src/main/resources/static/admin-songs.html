<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Songs — MusicLib Admin</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      MusicLib Admin
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item"><a href="/admin-dashboard.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Dashboard
        </a></li>
        <li class="nav-item"><a href="/admin-songs.html" class="active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg> Manage Songs
        </a></li>
        <li class="nav-item"><a href="/admin-users.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> Manage Users
        </a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-secondary btn-full btn-sm" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="navbar">
      <div class="navbar-brand">🎵 Manage Songs</div>
      <div class="navbar-spacer"></div>
      <div class="navbar-user">
        <div class="user-avatar" id="nav-user-avatar" style="background:var(--info);">A</div>
        <span id="nav-user-name">Admin</span>
      </div>
    </header>

    <main class="main-content">
      <div class="page-header-row">
        <div class="page-header">
          <h1>Song Library</h1>
          <p>Add, update, delete and control song visibility</p>
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Song</button>
      </div>

      <div class="search-bar mb-3">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search songs...">
        </div>
        <button class="btn btn-primary btn-sm" onclick="searchSongs()">Search</button>
        <button class="btn btn-secondary btn-sm" onclick="loadSongs()">Reset</button>
      </div>

      <div id="alert" class="alert"></div>

      <div class="card">
        <div class="table-wrapper" id="songsTable">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Song Modal -->
<div class="modal-overlay" id="songModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add New Song</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" class="form-control" id="fTitle" placeholder="Song title" required>
        </div>
        <div class="form-group">
          <label>Singer *</label>
          <input type="text" class="form-control" id="fSinger" placeholder="Singer name" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Music Director *</label>
          <input type="text" class="form-control" id="fDirector" placeholder="Music director" required>
        </div>
        <div class="form-group">
          <label>Album Name</label>
          <input type="text" class="form-control" id="fAlbum" placeholder="Album name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Genre</label>
          <input type="text" class="form-control" id="fGenre" placeholder="Pop, Rock, Bollywood...">
        </div>
        <div class="form-group">
          <label>Duration</label>
          <input type="text" class="form-control" id="fDuration" placeholder="e.g. 3:45">
        </div>
      </div>
      <div class="form-group">
        <label>Release Date</label>
        <input type="date" class="form-control" id="fDate">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveSong()">Add Song</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let editingId = null;

  async function init() {
    if (!requireAuth('admin')) return;
    setUserNav();
    await loadSongs();
  }

  async function loadSongs() {
    document.getElementById('searchInput').value = '';
    const res = await apiGet('/api/songs/all');
    renderTable(res?.data || []);
  }

  async function searchSongs() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { loadSongs(); return; }
    const res = await apiGet(`/api/songs/search?query=${encodeURIComponent(q)}`);
    renderTable(res?.data || []);
  }

  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchSongs(); });

  function renderTable(songs) {
    const el = document.getElementById('songsTable');
    if (!songs.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div><h3>No songs found</h3></div>';
      return;
    }
    el.innerHTML = `<table>
      <thead><tr><th>#</th><th>Title</th><th>Singer</th><th>Music Director</th><th>Album</th><th>Genre</th><th>Visibility</th><th>Actions</th></tr></thead>
      <tbody>${songs.map(s => `
        <tr>
          <td>${s.id}</td>
          <td><strong>${s.title}</strong></td>
          <td>${s.singer}</td>
          <td>${s.musicDirector}</td>
          <td>${s.albumName || '—'}</td>
          <td>${s.genre || '—'}</td>
          <td><span class="status-badge ${s.visible ? 'visible' : 'hidden'}">${s.visible ? '👁 Visible' : '🚫 Hidden'}</span></td>
          <td>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-secondary" onclick="editSong(${s.id})">✏️</button>
              <button class="btn btn-sm btn-warning" onclick="toggleVis(${s.id})" title="${s.visible ? 'Hide' : 'Show'}">${s.visible ? '🚫' : '👁'}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteSong(${s.id})">🗑</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add New Song';
    document.getElementById('modalSaveBtn').textContent = 'Add Song';
    ['fTitle','fSinger','fDirector','fAlbum','fGenre','fDuration','fDate'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('songModal').classList.add('open');
  }

  async function editSong(id) {
    const res = await apiGet(`/api/songs/${id}`);
    if (!res?.ok) return;
    const s = res.data;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Song';
    document.getElementById('modalSaveBtn').textContent = 'Save Changes';
    document.getElementById('fTitle').value = s.title;
    document.getElementById('fSinger').value = s.singer;
    document.getElementById('fDirector').value = s.musicDirector;
    document.getElementById('fAlbum').value = s.albumName || '';
    document.getElementById('fGenre').value = s.genre || '';
    document.getElementById('fDuration').value = s.duration || '';
    document.getElementById('fDate').value = s.releaseDate || '';
    document.getElementById('songModal').classList.add('open');
  }

  function closeModal() { document.getElementById('songModal').classList.remove('open'); }

  async function saveSong() {
    const body = {
      title: document.getElementById('fTitle').value.trim(),
      singer: document.getElementById('fSinger').value.trim(),
      musicDirector: document.getElementById('fDirector').value.trim(),
      albumName: document.getElementById('fAlbum').value.trim() || null,
      genre: document.getElementById('fGenre').value.trim() || null,
      duration: document.getElementById('fDuration').value.trim() || null,
      releaseDate: document.getElementById('fDate').value || null
    };

    if (!body.title || !body.singer || !body.musicDirector) { alert('Title, Singer and Music Director are required'); return; }

    const res = editingId ? await apiPut(`/api/songs/${editingId}`, body) : await apiPost('/api/songs', body);

    if (res?.ok) {
      closeModal();
      showAlert('alert', editingId ? 'Song updated!' : 'Song added! Users will be notified.', 'success');
      await loadSongs();
    } else {
      showAlert('alert', res?.data?.message || 'Failed to save song');
    }
  }

  async function toggleVis(id) {
    const res = await apiPatch(`/api/songs/${id}/visibility`);
    if (res?.ok) { showAlert('alert', `Visibility toggled!`, 'success'); await loadSongs(); }
    else showAlert('alert', 'Failed to toggle visibility');
  }

  async function deleteSong(id) {
    if (!confirm('Delete this song permanently?')) return;
    const res = await apiDelete(`/api/songs/${id}`);
    if (res?.ok) { showAlert('alert', 'Song deleted', 'success'); await loadSongs(); }
    else showAlert('alert', 'Failed to delete song');
  }

  init();
</script>
</body>
</html>
