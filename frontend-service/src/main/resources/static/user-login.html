<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — MusicLib</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <h1>MusicLib</h1>
      <p>Sign in to continue listening</p>
    </div>

    <div class="auth-card">
      <h2>Welcome back 👋</h2>
      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
          Sign In
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="/user-register.html">Create one</a>
    </p>
    <p class="auth-footer" style="margin-top: 8px;">
      <a href="/index.html" onclick="sessionStorage.clear()">&#8592; Back to Home</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (isLoggedIn()) {
    window.location.href = isAdmin() ? '/admin-dashboard.html' : '/user-dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Signing in...';

    try {
      const res = await apiPost('/api/users/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      if (res && res.ok) {
        sessionStorage.setItem('token', res.data.token);
        sessionStorage.setItem('user', JSON.stringify(res.data));
        window.location.href = '/user-dashboard.html';
      } else {
        showAlert('alert', res?.data?.message || 'Invalid email or password');
      }
    } catch (err) {
      showAlert('alert', 'Connection error. Please check services are running.');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
