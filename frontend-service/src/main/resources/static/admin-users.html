<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — MusicLib Admin</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      MusicLib Admin
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item"><a href="/admin-dashboard.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Dashboard
        </a></li>
        <li class="nav-item"><a href="/admin-songs.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg> Manage Songs
        </a></li>
        <li class="nav-item"><a href="/admin-users.html" class="active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg> Manage Users
        </a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-secondary btn-full btn-sm" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="navbar">
      <div class="navbar-brand">👥 Manage Users</div>
      <div class="navbar-spacer"></div>
      <div class="navbar-user">
        <div class="user-avatar" id="nav-user-avatar" style="background:var(--info);">A</div>
        <span id="nav-user-name">Admin</span>
      </div>
    </header>

    <main class="main-content">
      <div class="page-header-row">
        <div class="page-header">
          <h1>User Management</h1>
          <p>View, enable, disable and delete users</p>
        </div>
      </div>

      <div class="search-bar mb-3">
        <div class="search-input-wrap">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Filter users by name or email...">
        </div>
      </div>

      <div id="alert" class="alert"></div>

      <div class="card">
        <div class="table-wrapper" id="usersTable">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit User</h3>
      <button class="btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editUserId">
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" id="editName" placeholder="User name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" class="form-control" id="editPhone" placeholder="Phone number">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let allUsers = [];

  async function init() {
    if (!requireAuth('admin')) return;
    setUserNav();
    await loadUsers();
  }

  async function loadUsers() {
    const res = await apiGet('/api/admin/users');
    allUsers = res?.data || [];
    renderTable(allUsers);
  }

  document.getElementById('searchInput').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    const filtered = allUsers.filter(u =>
      u.name?.toLowerCase().includes(q) || u.email?.toLowerCase().includes(q)
    );
    renderTable(filtered);
  });

  function renderTable(users) {
    const el = document.getElementById('usersTable');
    if (!users.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><h3>No users found</h3></div>';
      return;
    }
    el.innerHTML = `<table>
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>${users.map(u => `
        <tr>
          <td style="color:var(--text-muted)">#${u.id}</td>
          <td><strong>${u.name}</strong></td>
          <td>${u.email}</td>
          <td>${u.phoneNumber || '—'}</td>
          <td><span class="status-badge ${u.enabled ? 'active' : 'inactive'}">${u.enabled ? '✓ Active' : '✗ Disabled'}</span></td>
          <td>${formatDate(u.createdAt)}</td>
          <td>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-secondary" onclick="openEditModal(${u.id},'${u.name.replace(/'/g,"\\'")}','${(u.phoneNumber||'').replace(/'/g,"\\'")}')">✏️</button>
              <button class="btn btn-sm ${u.enabled ? 'btn-warning' : 'btn-success'}" onclick="toggleUser(${u.id},${u.enabled})">${u.enabled ? '🚫 Disable' : '✅ Enable'}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">🗑</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  function openEditModal(id, name, phone) {
    document.getElementById('editUserId').value = id;
    document.getElementById('editName').value = name;
    document.getElementById('editPhone').value = phone;
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() { document.getElementById('editModal').classList.remove('open'); }

  async function saveUser() {
    const id = document.getElementById('editUserId').value;
    const body = {
      name: document.getElementById('editName').value.trim(),
      phoneNumber: document.getElementById('editPhone').value.trim()
    };
    const res = await apiPut(`/api/admin/users/${id}`, body);
    if (res?.ok) { closeModal(); showAlert('alert', 'User updated!', 'success'); await loadUsers(); }
    else showAlert('alert', 'Failed to update user');
  }

  async function toggleUser(id, enabled) {
    const action = enabled ? 'disable' : 'enable';
    if (!confirm(`${action.charAt(0).toUpperCase() + action.slice(1)} this user?`)) return;
    const res = await apiPatch(`/api/admin/users/${id}/${action}`);
    if (res?.ok) { showAlert('alert', `User ${action}d!`, 'success'); await loadUsers(); }
    else showAlert('alert', `Failed to ${action} user`);
  }

  async function deleteUser(id) {
    if (!confirm('Permanently delete this user?')) return;
    const res = await apiDelete(`/api/admin/users/${id}`);
    if (res?.ok) { showAlert('alert', 'User deleted', 'success'); await loadUsers(); }
    else showAlert('alert', 'Failed to delete user');
  }

  init();
</script>
</body>
</html>
