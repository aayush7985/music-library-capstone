<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — MusicLib</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      MusicLib
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li class="nav-item"><a href="/user-dashboard.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Home
        </a></li>
        <li class="nav-item"><a href="/playlists.html">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg> My Playlists
        </a></li>
        <li class="nav-item"><a href="/profile.html" class="active">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Profile
        </a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-secondary btn-full btn-sm" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="navbar">
      <div class="navbar-brand">👤 My Profile</div>
      <div class="navbar-spacer"></div>
      <div class="navbar-user">
        <div class="user-avatar" id="nav-user-avatar">U</div>
        <span id="nav-user-name">User</span>
      </div>
    </header>

    <main class="main-content">
      <div id="alert" class="alert"></div>

      <div style="max-width:540px; margin:0 auto;">
        <div class="card mb-3">
          <div class="card-header">
            <span class="fw-bold">Account Information</span>
          </div>
          <div class="card-body" id="profileInfo">
            <div class="empty-state"><div class="spinner"></div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="fw-bold">Update Profile</span></div>
          <div class="card-body">
            <form id="updateForm">
              <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control" id="updName" placeholder="Your name">
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" class="form-control" id="updPhone" placeholder="10-digit number">
              </div>
              <div class="form-group">
                <label>New Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="updPwd" placeholder="New password">
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let currentUser = null;

  async function init() {
    if (!requireAuth('user')) return;
    currentUser = getUser();
    setUserNav();
    await loadProfile();
  }

  async function loadProfile() {
    const uid = currentUser?.userId || currentUser?.id;
    const res = await apiGet(`/api/users/${uid}`);
    if (!res?.ok) return;
    const u = res.data;
    document.getElementById('profileInfo').innerHTML = `
      <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px;">
        <div style="width:70px;height:70px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:white;">
          ${u.name[0].toUpperCase()}
        </div>
        <div>
          <div style="font-size:1.3rem;font-weight:700;">${u.name}</div>
          <div style="color:var(--text-secondary);">${u.email}</div>
          <span class="status-badge ${u.enabled ? 'active' : 'inactive'}">${u.enabled ? '✓ Active' : '✗ Disabled'}</span>
        </div>
      </div>
      <div class="meta-grid">
        <div class="meta-item"><label>Phone</label><span>${u.phoneNumber}</span></div>
        <div class="meta-item"><label>Member Since</label><span>${formatDate(u.createdAt)}</span></div>
        <div class="meta-item"><label>Role</label><span>${u.role}</span></div>
      </div>`;

    document.getElementById('updName').value = u.name;
    document.getElementById('updPhone').value = u.phoneNumber;
  }

  document.getElementById('updateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const uid = currentUser?.userId || currentUser?.id;
    const body = {};
    const n = document.getElementById('updName').value.trim();
    const p = document.getElementById('updPhone').value.trim();
    const pwd = document.getElementById('updPwd').value;
    if (n) body.name = n;
    if (p) body.phoneNumber = p;
    if (pwd) body.password = pwd;

    const res = await apiPut(`/api/users/${uid}`, body);
    if (res?.ok) {
      const stored = JSON.parse(sessionStorage.getItem('user') || '{}');
      if (n) stored.name = n;
      sessionStorage.setItem('user', JSON.stringify(stored));
      showAlert('alert', 'Profile updated!', 'success');
      setUserNav();
      await loadProfile();
    } else {
      showAlert('alert', res?.data?.message || 'Failed to update profile');
    }
  });

  init();
</script>
</body>
</html>
